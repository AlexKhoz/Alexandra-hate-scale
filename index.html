    --bg: #c8261f;
    --ink: #fff7f2;
    --soft: rgba(255, 247, 242, .74);
    --line: rgba(255, 247, 242, .32);
    --trough: rgba(60, 0, 0, .34);
    --ghost: #b4221c;              /* фон + 10% чёрного, сплошной цвет */
    --thumb-w: 46px;
    --thumb-h: 51px;
    --track: 14px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 24px 18px 56px;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  button, input { font: inherit; color: inherit; }

  .app-title { margin: 0 0 4px; font-size: 15px; font-weight: 900; color: var(--soft); }

  /* ---------- Блок «заголовок + шкала» ---------- */
  .list { margin: 0; padding: 0; list-style: none; }
  .item { padding: 22px 0 22px; border-bottom: 2px solid var(--line); }

  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .item-title {
    flex: 1;
    min-width: 0;
    margin: 0;
    font-size: 26px;
    line-height: 1.1;
    font-weight: 900;
    word-break: break-word;
    outline: none;
    border-bottom: 2px dashed transparent;
    padding-bottom: 2px;
  }
  .item-title:focus { border-bottom-color: var(--soft); }
  .item-title:empty::before { content: "Заголовок"; color: var(--soft); }
  .count {
    flex: none;
    font-size: 26px;
    line-height: 1.1;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
  }
  .count small { font-size: 15px; color: var(--soft); }
  .count.bump { animation: bump .28s ease-out; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }

  /* ---------- Слайдер ---------- */
  .slider {
    --p: 0;
    display: block;
    width: 100%;
    height: calc(var(--thumb-h) + 10px);
    margin: 0 0 6px;
    padding: 0;
    background: transparent;
    -webkit-appearance: none;
    appearance: none;
    touch-action: pan-y;
    outline: none;
    cursor: pointer;
  }
  .slider::-webkit-slider-runnable-track {
    height: var(--track);
    border-radius: 99px;
    background: linear-gradient(to right,
      var(--ink) calc(var(--thumb-w) / 2 + (100% - var(--thumb-w)) * var(--p)),
      var(--trough) 0);
  }
  .slider::-moz-range-track {
    height: var(--track);
    border-radius: 99px;
    background: linear-gradient(to right,
      var(--ink) calc(var(--thumb-w) / 2 + (100% - var(--thumb-w)) * var(--p)),
      var(--trough) 0);
  }
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: var(--thumb-w);
    height: var(--thumb-h);
    margin-top: calc((var(--track) - var(--thumb-h)) / 2);
    border: 0;
    border-radius: 0;
    background: var(--sticker) center / contain no-repeat;
    transition: transform .12s ease-out;
  }
  .slider::-moz-range-thumb {
    width: var(--thumb-w);
    height: var(--thumb-h);
    border: 0;
    border-radius: 0;
    background: var(--sticker) center / contain no-repeat;
  }
  .slider:active::-webkit-slider-thumb { transform: scale(1.18) rotate(-4deg); }

  /* ---------- Замочек ---------- */
  .lock {
    flex: none;
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    margin: -4px -6px 0 -4px;
    padding: 0;
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--line);
    border-radius: 50%;
    touch-action: manipulation;
  }
  .lock svg { width: 22px; height: 22px; display: block; }
  .lock .closed { display: none; }
  .lock[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .lock[aria-pressed="true"] .closed { display: block; }
  .lock[aria-pressed="true"] .opened { display: none; }
  .lock:active { transform: scale(.92); }
  .item.locked .slider { cursor: default; }

  /* ---------- Лица: одна строка, можно с наложением ---------- */
  .faces { display: flex; padding-top: 14px; isolation: isolate; }
  .face {
    position: relative;
    flex: none;
    width: 20%;
    margin-left: -11.111%;          /* 10 лиц ровно в ширину строки */
    aspect-ratio: 300 / 334;
    --tilt: -3deg;
  }
  .face:first-child { margin-left: 0; }
  .face:nth-child(even) { --tilt: 2deg; }
  .face:nth-child(3n) { --tilt: -1deg; }
  .face i {
    position: absolute;
    inset: 0;
    background: var(--sticker) center / contain no-repeat;
  }
  /* пустая ячейка: сплошной силуэт цвета «фон + 10% чёрного», без прозрачности */
  .face .ghost {
    z-index: 0;
    background: var(--ghost);
    -webkit-mask: var(--sticker) center / contain no-repeat;
            mask: var(--sticker) center / contain no-repeat;
  }
  .face .full {
    z-index: 1;
    opacity: 0;
    transform: scale(.35) rotate(-10deg);
    transition: opacity .14s ease, transform .16s ease;
  }
  .face.on .full { opacity: 1; transform: rotate(var(--tilt)); }

  /* Поп-анимация: срабатывает на новых лицах, когда двигаешь слайдер */
  .face.pop .full { z-index: 5; }
  .face.pop .full { animation: pop .52s cubic-bezier(.2, .9, .3, 1) backwards; animation-delay: var(--d, 0ms); }
  @keyframes pop {
    0%   { opacity: 0; transform: scale(.1) rotate(-22deg); }
    45%  { opacity: 1; transform: scale(1.38) rotate(9deg); }
    70%  { transform: scale(.9) rotate(-5deg); }
    100% { transform: scale(1) rotate(var(--tilt)); }
  }

  /* ---------- Удаление ---------- */
  .foot { display: flex; justify-content: flex-end; margin-top: 8px; }
  .del {
    font-size: 14px;
    font-weight: 700;
    color: var(--soft);
    background: none;
    border: 0;
    padding: 8px 0 8px 12px;
    text-decoration: underline;
    text-underline-offset: 3px;
    touch-action: manipulation;
  }
  .del.sure { color: var(--ink); font-weight: 900; }

  .empty { margin: 28px 0 0; font-size: 17px; line-height: 1.35; color: var(--soft); }

  /* ---------- Кнопка «Новая шкала» ---------- */
  .new {
    display: block;
    width: 100%;
    margin-top: 26px;
    padding: 16px 18px;
    font-size: 18px;
    font-weight: 900;
    color: var(--bg);
    background: var(--ink);
    border: 0;
    border-radius: 16px;
    touch-action: manipulation;
  }
  .new:active { transform: scale(.98); }

  /* ---------- Сохранение в файл ---------- */
  .backup { margin-top: 38px; padding-top: 18px; border-top: 2px solid var(--line); }
  .backup p { margin: 0 0 12px; font-size: 14px; line-height: 1.35; color: var(--soft); }
  .backup .row { display: flex; gap: 10px; }
  .backup .btn {
    flex: 1;
    text-align: center;
    font-size: 15px;
    font-weight: 900;
    padding: 12px 10px;
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--ink);
    border-radius: 999px;
    touch-action: manipulation;
  }
  .backup .btn:active { background: var(--ink); color: var(--bg); }
  #file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #status { min-height: 1.4em; margin-top: 12px; font-size: 14px; color: var(--ink); }

  /* ---------- Статус синхронизации ---------- */
  .sync { display: flex; align-items: center; gap: 9px; margin-top: 16px; font-size: 14px; }
  .sync .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); }
  .sync[data-state="off"] .dot, .sync[data-state="auth"] .dot { background: transparent; border: 2px solid var(--ink); }
  .sync[data-state="busy"] .dot { animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .sync-btn {
    margin-left: auto;
    font-size: 14px;
    font-weight: 700;
    color: var(--soft);
    background: none;
    border: 0;
    padding: 8px 0 8px 12px;
    text-decoration: underline;
    text-underline-offset: 3px;
    touch-action: manipulation;
  }
  .sync-btn[hidden] { display: none; }

  button:focus-visible, .slider:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .face.pop .full, .count.bump, .sync[data-state="busy"] .dot { animation: none; }
    .face .full, .slider::-webkit-slider-thumb { transition: none; }
  }
</style>
</head>
<body>
<main>
  <h1 class="app-title">Шкала ХЕЙТА</h1>

  <ol class="list" id="list"></ol>
  <p class="empty" id="empty" hidden>Шкал пока нет. Нажми кнопку ниже, чтобы создать первую.</p>

  <button type="button" class="new" id="newBtn">+ Новая шкала</button>

  <section class="backup">
    <p>Шкалы хранятся на этом телефоне и синхронизируются между устройствами. На всякий случай можно сохранить копию в файл.</p>
    <div class="row">
      <button type="button" class="btn" id="exportBtn">Сохранить в файл</button>
      <button type="button" class="btn" id="importBtn">Загрузить из файла</button>
    </div>
    <input type="file" id="file" accept=".json,application/json,text/plain">
    <div class="sync" id="sync" data-state="busy">
      <span class="dot" aria-hidden="true"></span>
      <span id="syncText" aria-live="polite">Синхронизация…</span>
      <button type="button" class="sync-btn" id="syncBtn" hidden>Обновить</button>
    </div>
    <div id="status" aria-live="polite"></div>
  </section>
</main>

<script>
  var MAX = 10;
  var KEY = "hate-scales-v2";            // шкалы (как и раньше)
  var DKEY = "hate-deleted-v1";          // метки удаления
  var PKEY = "hate-sync-pass-v1";        // пароль синхронизации
  var FKEY = "hate-dirty-v1";            // есть изменения, ещё не отправленные на сервер
  var API = "/api/sync";
  var DEBOUNCE = 1500;                   // отправка через 1,5 с после последнего изменения
  var MIN_GAP = 20000;                   // возврат на вкладку не чаще раза в 20 с
  var items = [];
  var deleted = [];
  var seed = null;                       // стартовая шкала на пустом устройстве: пока её не тронули, на сервер не уходит

  var listEl = document.getElementById("list");
  var emptyEl = document.getElementById("empty");
  var statusEl = document.getElementById("status");
  var fileEl = document.getElementById("file");

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var saveWorks = true;

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  /* ===== Слияние данных. Этот блок одинаковый на сервере и в странице ===== */
  var KEEP_DELETED = 365 * 24 * 3600 * 1000;      // метки удаления живут год

  function num(v) { v = Number(v); return isFinite(v) && v > 0 ? Math.floor(v) : 0; }
  function idTime(id) { var t = parseInt(String(id).slice(0, 8), 36); return t > 1e12 ? t : 0; }

  function cleanItem(x) {
    if (!x || typeof x !== "object") return null;
    if (typeof x.id !== "string" || !x.id || x.id.length > 64) return null;
    var lvl = parseInt(x.level, 10);
    return {
      id: x.id,
      title: typeof x.title === "string" ? x.title.slice(0, 500) : "",
      level: lvl >= 0 && lvl <= MAX ? lvl : 0,
      locked: x.locked === true,
      created: num(x.created) || idTime(x.id),
      updatedAt: num(x.updatedAt)
    };
  }

  function cleanState(s) {
    var out = { items: [], deleted: [] };
    if (!s || typeof s !== "object") return out;
    if (Array.isArray(s.items)) s.items.slice(0, 500).forEach(function (x) {
      var c = cleanItem(x); if (c) out.items.push(c);
    });
    if (Array.isArray(s.deleted)) s.deleted.slice(0, 2000).forEach(function (d) {
      if (d && typeof d.id === "string" && d.id && d.id.length <= 64) out.deleted.push({ id: d.id, deletedAt: num(d.deletedAt) });
    });
    return out;
  }

  // Для каждой шкалы побеждает более поздняя метка (правка или удаление).
  // При равенстве: удаление сильнее правки, а между двумя правками побеждает b.
  function mergeStates(a, b) {
    var best = Object.create(null);
    function take(id, t, del, obj) {
      var c = best[id];
      if (!c || t > c.t || (t === c.t && (del || !c.del))) best[id] = { t: t, del: del, obj: obj };
    }
    [a, b].forEach(function (s) {
      s.items.forEach(function (x) { take(x.id, x.updatedAt, false, x); });
      s.deleted.forEach(function (d) { take(d.id, d.deletedAt, true, d); });
    });
    var limit = Date.now() - KEEP_DELETED, items = [], deleted = [];
    Object.keys(best).forEach(function (id) {
      var c = best[id];
      if (c.del) { if (c.obj.deletedAt >= limit) deleted.push(c.obj); }
      else items.push(c.obj);
    });
    items.sort(function (x, y) { return (x.created - y.created) || (x.id < y.id ? -1 : x.id > y.id ? 1 : 0); });
    deleted.sort(function (x, y) { return x.id < y.id ? -1 : x.id > y.id ? 1 : 0; });
    return { items: items, deleted: deleted };
  }

  var EMPTY = { items: [], deleted: [] };
  function canonJSON(s) { return JSON.stringify(mergeStates(cleanState(s), EMPTY)); }

  /* ---------- Хранилище ---------- */
  function save() {
    try {
      var list = items.filter(function (x) { return x !== seed; });
      if (seed && !list.length) return;      // пустое устройство, ничего не трогали: не пишем
      localStorage.setItem(KEY, JSON.stringify(list));
      localStorage.setItem(DKEY, JSON.stringify(deleted));
    } catch (e) { saveWorks = false; }
  }
  function clean(arr) {
    var out = [];
    if (!Array.isArray(arr)) return out;
    arr.forEach(function (x) {
      if (!x || typeof x !== "object") return;
      if (typeof x.id !== "string" || !x.id) { var y = {}; for (var k in x) y[k] = x[k]; y.id = uid(); x = y; }
      var c = cleanItem(x);
      if (c) out.push(c);
    });
    return out;
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return clean(JSON.parse(raw));
      var oldTitle = localStorage.getItem("hate-title");
      var oldLevel = parseInt(localStorage.getItem("hate-level"), 10);
      if (oldTitle !== null) return clean([{ id: uid(), title: oldTitle, level: oldLevel > 0 ? oldLevel : 0 }]);
    } catch (e) { saveWorks = false; }
    seed = cleanItem({ id: uid(), title: "Мой заголовок", level: 0, created: Date.now() });
    return [seed];
  }
  function loadDeleted() {
    try { return cleanState({ deleted: JSON.parse(localStorage.getItem(DKEY) || "[]") }).deleted; }
    catch (e) { return []; }
  }

  function say(text) { statusEl.textContent = text; }

  /* ---------- Обновление одного блока ---------- */
  function updateItem(node, level, animate) {
    var faces = node.querySelectorAll(".face");
    var prev = parseInt(node.dataset.level, 10) || 0;
    var k = 0;
    for (var i = 0; i < faces.length; i++) {
      var face = faces[i];
      var shouldBeOn = i < level;
      var isOn = face.classList.contains("on");
      if (shouldBeOn && !isOn) {
        face.classList.add("on");
        if (animate && !reduceMotion) {
          face.classList.remove("pop");
          void face.offsetWidth;                 // перезапуск анимации
          face.style.setProperty("--d", (k * 35) + "ms");
          face.classList.add("pop");
          k++;
        }
      } else if (!shouldBeOn && isOn) {
        face.classList.remove("on", "pop");
      }
    }
    var slider = node.querySelector(".slider");
    slider.value = level;
    slider.style.setProperty("--p", level / MAX);
    slider.setAttribute("aria-valuetext", level + " из " + MAX);
    node.querySelector(".val").textContent = level;
    if (animate && level !== prev && !reduceMotion) {
      var c = node.querySelector(".count");
      c.classList.remove("bump");
      void c.offsetWidth;
      c.classList.add("bump");
    }
    if (animate && level > prev && navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
    node.dataset.level = level;
  }

  /* ---------- Построение блока ---------- */
  var LOCK_SVG =
    '<svg viewBox="0 0 24 24" aria-hidden="true">' +
      '<rect x="5" y="11" width="14" height="10" rx="2.5" fill="currentColor"/>' +
      '<path class="closed" d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>' +
      '<path class="opened" d="M8 11V8a4 4 0 0 1 7.4-2.1" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>' +
    '</svg>';

  function applyLock(li, item) {
    var on = item.locked === true;
    var lock = li.querySelector(".lock");
    li.classList.toggle("locked", on);
    li.querySelector(".slider").disabled = on;
    lock.setAttribute("aria-pressed", on ? "true" : "false");
    lock.setAttribute("aria-label", on ? "Снять фиксацию оценки" : "Зафиксировать оценку");
  }

  function buildItem(item) {
    var li = document.createElement("li");
    li.className = "item";
    li.dataset.id = item.id;
    li.dataset.level = 0;

    var facesHtml = "";
    for (var n = 1; n <= MAX; n++) facesHtml += '<div class="face"><i class="ghost"></i><i class="full"></i></div>';

    li.innerHTML =
      '<div class="head">' +
        '<h2 class="item-title" contenteditable="true" spellcheck="false" role="textbox" aria-label="Заголовок"></h2>' +
        '<div class="count" aria-live="polite"><span class="val">0</span><small> / ' + MAX + '</small></div>' +
        '<button type="button" class="lock" aria-pressed="false" aria-label="Зафиксировать оценку">' + LOCK_SVG + '</button>' +
      '</div>' +
      '<input class="slider" type="range" min="0" max="' + MAX + '" step="1" value="0" aria-label="Уровень хейта">' +
      '<div class="faces">' + facesHtml + '</div>' +
      '<div class="foot"><button type="button" class="del">Удалить</button></div>';

    var title = li.querySelector(".item-title");
    title.textContent = item.title;
    title.addEventListener("input", function () { item.title = title.textContent; touch(item); });
    title.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); title.blur(); } });
    title.addEventListener("paste", function (e) {
      e.preventDefault();
      var t = (e.clipboardData || window.clipboardData).getData("text");
      document.execCommand("insertText", false, t.replace(/\s+/g, " "));
    });

    li.querySelector(".faces").addEventListener("animationend", function (e) {
      var f = e.target.parentNode;
      if (f && f.classList) f.classList.remove("pop");
    });

    var slider = li.querySelector(".slider");
    slider.addEventListener("input", function () {
      var v = parseInt(slider.value, 10);
      item.level = v;
      updateItem(li, v, true);
      touch(item);
    });

    var lockBtn = li.querySelector(".lock");
    lockBtn.addEventListener("click", function () {
      item.locked = !item.locked;
      applyLock(li, item);
      touch(item);
      if (navigator.vibrate) { try { navigator.vibrate(item.locked ? 14 : 6); } catch (e) {} }
    });

    // удаление: два нажатия вместо окна подтверждения
    var del = li.querySelector(".del");
    var timer = null;
    del.addEventListener("click", function () {
      if (!del.classList.contains("sure")) {
        del.classList.add("sure");
        del.textContent = "Нажми ещё раз";
        timer = setTimeout(function () { del.classList.remove("sure"); del.textContent = "Удалить"; }, 3000);
        return;
      }
      clearTimeout(timer);
      items = items.filter(function (x) { return x.id !== item.id; });
      if (seed === item) seed = null; else markDeleted(item);
      li.remove();
      syncEmpty();
      changed();
    });

    updateItem(li, item.level, false);
    applyLock(li, item);
    return li;
  }

  function syncEmpty() { emptyEl.hidden = items.length > 0; }

  function renderAll() {
    listEl.innerHTML = "";
    items.forEach(function (item) { listEl.appendChild(buildItem(item)); });
    syncEmpty();
  }

  // Обновляет список на странице по `items`, не пересоздавая блоки, которые не изменились
  // (чтобы не сбивать курсор и слайдер, когда данные приходят с сервера).
  function reconcile() {
    var have = Object.create(null);
    Array.prototype.forEach.call(listEl.children, function (li) { have[li.dataset.id] = li; });
    var used = Object.create(null);
    items.forEach(function (item, i) {
      var li = have[item.id];
      if (!li) li = buildItem(item);
      else {
        var t = li.querySelector(".item-title");
        if (document.activeElement !== t && t.textContent !== item.title) t.textContent = item.title;
        if ((parseInt(li.dataset.level, 10) || 0) !== item.level) updateItem(li, item.level, false);
        applyLock(li, item);
      }
      used[item.id] = true;
      var ref = listEl.children[i];
      if (ref !== li) listEl.insertBefore(li, ref || null);
    });
    Array.prototype.slice.call(listEl.children).forEach(function (li) { if (!used[li.dataset.id]) li.remove(); });
    syncEmpty();
  }

  /* ---------- Учёт изменений ---------- */
  function markDeleted(item) {
    deleted = deleted.filter(function (d) { return d.id !== item.id; });
    deleted.push({ id: item.id, deletedAt: Math.max(Date.now(), (item.updatedAt || 0) + 1) });
  }
  function touch(item) {                   // шкалу изменили
    if (seed === item) seed = null;
    item.updatedAt = Math.max(Date.now(), (item.updatedAt || 0) + 1);
    changed();
  }
  function changed() {
    save(); setDirty(true); schedule();
    if (navigator.onLine === false) showOffline();      // без сети сразу показываем «отправится позже»
    else if (pass) setSync("busy", "Синхронизация…");   // изменения ждут отправки (1,5 с)
  }

  /* ---------- Новая шкала ---------- */
  document.getElementById("newBtn").addEventListener("click", function () {
    seed = null;
    var now = Date.now();
    var item = cleanItem({ id: uid(), title: "Новый заголовок", level: 0, locked: false, created: now, updatedAt: now });
    items.push(item);
    changed();
    var node = buildItem(item);
    listEl.appendChild(node);
    syncEmpty();
    node.scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" });
    // сразу можно вписать заголовок
    var t = node.querySelector(".item-title");
    try {
      t.focus();
      var r = document.createRange(); r.selectNodeContents(t);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    } catch (e) {}
  });

  /* ---------- Сохранение в файл / загрузка из файла ---------- */
  document.getElementById("exportBtn").addEventListener("click", function () {
    try {
      var data = JSON.stringify({ app: "hate-scale", version: 2, items: items.filter(function (x) { return x !== seed; }) }, null, 2);
      var blob = new Blob([data], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "hate-scales.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      say("Файл hate-scales.json сохранён (смотри «Загрузки»).");
    } catch (e) {
      say("Не удалось сохранить файл в этом браузере. Попробуй открыть страницу в Chrome.");
    }
  });

  document.getElementById("importBtn").addEventListener("click", function () { fileEl.click(); });
  fileEl.addEventListener("change", function () {
    var f = fileEl.files && fileEl.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var obj = JSON.parse(reader.result);
        var arr = Array.isArray(obj) ? obj : obj.items;
        var next = clean(arr);
        if (!next.length && !(Array.isArray(arr) && arr.length === 0)) throw new Error("empty");
        // Загрузка заменяет всё: шкалы из файла становятся «новыми», остальные помечаются удалёнными
        var now = Date.now(), inFile = Object.create(null), old = Object.create(null), oldDel = Object.create(null);
        items.forEach(function (x) { old[x.id] = x; });
        deleted.forEach(function (d) { oldDel[d.id] = d.deletedAt; });
        next.forEach(function (x) {
          inFile[x.id] = true;
          var prev = Math.max(old[x.id] ? old[x.id].updatedAt : 0, oldDel[x.id] || 0);
          x.updatedAt = Math.max(now, prev + 1);
        });
        var del = deleted.filter(function (d) { return !inFile[d.id]; });
        items.forEach(function (x) {
          if (x !== seed && !inFile[x.id]) del.push({ id: x.id, deletedAt: Math.max(now, (x.updatedAt || 0) + 1) });
        });
        seed = null;
        items = next;
        deleted = del;
        renderAll();
        changed();
        say("Загружено шкал: " + items.length + ".");
      } catch (e) {
        say("Это не похоже на файл, сохранённый этой страницей.");
      }
      fileEl.value = "";
    };
    reader.onerror = function () { say("Не удалось прочитать файл."); };
    reader.readAsText(f);
  });

  /* ---------- Синхронизация с сервером ---------- */
  var syncEl = document.getElementById("sync");
  var syncText = document.getElementById("syncText");
  var syncBtn = document.getElementById("syncBtn");
  var syncAction = "refresh";
  var pass = "";
  var dirty = false;
  var syncing = false, again = false, askedPass = false, authFailed = false, lastOk = 0, debounceTimer = null;

  function setSync(state, text, action, label) {
    syncEl.dataset.state = state;
    syncText.textContent = text;
    syncAction = action || "refresh";
    syncBtn.textContent = label || "Обновить";
    syncBtn.hidden = state === "busy";
  }
  syncBtn.addEventListener("click", function () {
    if (syncAction === "pass") askPass(); else syncNow(true);
  });

  function readPass() { try { return (localStorage.getItem(PKEY) || "").trim(); } catch (e) { return ""; } }
  function writePass(p) { try { if (p) localStorage.setItem(PKEY, p); else localStorage.removeItem(PKEY); } catch (e) {} }
  function setDirty(v) {
    dirty = v;
    try { if (v) localStorage.setItem(FKEY, "1"); else localStorage.removeItem(FKEY); } catch (e) {}
  }

  function needPass() {
    setSync("auth", "Нужен пароль", "pass", "Ввести пароль");
    if (!askedPass) { askedPass = true; setTimeout(askPass, 300); }   // один раз за открытие страницы
  }
  function askPass() {
    var p = window.prompt("Пароль синхронизации (тот же, что в SYNC_PASSWORD на Netlify):", "");
    p = p ? p.trim() : "";
    if (!p) { setSync("auth", "Нужен пароль", "pass", "Ввести пароль"); return; }
    pass = p; writePass(p); authFailed = false;
    syncNow(true);
  }
  function showOffline() {
    setSync("off", dirty ? "Нет связи · отправится позже" : "Нет связи", "refresh", "Повторить");
  }

  function schedule() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function () { debounceTimer = null; syncNow(false); }, DEBOUNCE);
  }

  function payload() { return { items: items.filter(function (x) { return x !== seed; }), deleted: deleted }; }

  function focusedTitleId() {
    var a = document.activeElement;
    return a && a.classList && a.classList.contains("item-title") ? a.closest(".item").dataset.id : null;
  }

  // Принять данные сервера: слить с тем, что на странице. Возвращает true, если у нас осталось то, чего нет на сервере.
  function applyRemote(remote) {
    var m = mergeStates({ items: items.filter(function (x) { return x !== seed; }), deleted: deleted }, remote);
    var focused = focusedTitleId();
    var byId = Object.create(null);
    items.forEach(function (x) { byId[x.id] = x; });
    var next = m.items.map(function (r) {
      var cur = byId[r.id];
      if (!cur) return r;
      if (cur !== r && cur.id !== focused) {      // сохраняем тот же объект: на него ссылаются обработчики блока
        cur.title = r.title; cur.level = r.level; cur.locked = r.locked; cur.created = r.created; cur.updatedAt = r.updatedAt;
      }
      return cur;
    });
    if (seed) { if (!next.length) next = [seed]; else seed = null; }
    items = next;
    deleted = m.deleted;
    save();
    reconcile();
    return canonJSON(m) !== canonJSON(remote);
  }

  function syncNow(force, depth) {
    clearTimeout(debounceTimer); debounceTimer = null;
    if (authFailed && !pass) { needPass(); return; }   // сервер просит пароль, а его ещё нет
    if (syncing) { again = true; return; }
    if (!force && !dirty && Date.now() - lastOk < MIN_GAP) return;
    if (navigator.onLine === false) { showOffline(); return; }
    run(depth || 0);
  }

  function run(depth) {
    syncing = true; again = false;
    var post = dirty;
    var body = post ? JSON.stringify(payload()) : undefined;
    var ctrl = window.AbortController ? new AbortController() : null;
    var abortTimer = ctrl ? setTimeout(function () { ctrl.abort(); }, 20000) : null;
    setSync("busy", "Синхронизация…");

    function finish() {
      clearTimeout(abortTimer);
      syncing = false;
      if (!again) return;
      if (depth < 3) syncNow(true, depth + 1);      // изменения во время запроса: отправить ещё раз
      else setSync("off", "Не удалось досинхронизировать", "refresh", "Повторить");
    }

    fetch(API, {
      method: post ? "POST" : "GET",
      headers: { "x-sync-password": encodeURIComponent(pass), "content-type": "application/json" },
      body: body,
      cache: "no-store",
      keepalive: !!(post && document.hidden && body.length < 60000),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (res) {
      if (res.status === 401) {
        pass = ""; writePass(""); authFailed = true;
        setSync("auth", "Нужен пароль", "pass", "Ввести пароль");
        finish();
        if (!askedPass) needPass();
        return;
      }
      return res.json().catch(function () { return null; }).then(function (data) {
        if (!res.ok || !data || !Array.isArray(data.items)) {
          setSync("off", "Ошибка сервера (" + res.status + ")", "refresh", "Повторить");
          finish();
          return;
        }
        var left = applyRemote(cleanState(data));
        setDirty(left);
        lastOk = Date.now();
        if (left) { again = true; setSync("busy", "Синхронизация…"); }
        else setSync("ok", "Синхронизировано", "refresh", "Обновить");
        finish();
      });
    }).catch(function () {
      showOffline();
      finish();
    });
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { save(); if (dirty) syncNow(true); }   // успеть отправить перед сворачиванием
    else syncNow(false);                                                  // вернулись на вкладку: подтянуть
  });
  window.addEventListener("pagehide", save);
  window.addEventListener("pageshow", function (e) { if (e.persisted) syncNow(false); });
  window.addEventListener("online", function () { syncNow(true); });
  window.addEventListener("offline", showOffline);

  /* ---------- Запуск ---------- */
  items = load();
  deleted = loadDeleted();
  dirty = (function () { try { return localStorage.getItem(FKEY) === "1"; } catch (e) { return false; } })();
  pass = readPass();
  renderAll();
  if (!saveWorks) say("Браузер не даёт сохранять данные на странице. Пользуйся кнопкой «Сохранить в файл».");
  syncNow(true);                                  // пароль спросим только если сервер его потребует
</script>
</body>
</html>
